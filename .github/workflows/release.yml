name: Release

# Pushing a tag like v1.0.0 publishes a GitHub release for it, with notes
# generated from the merged pull requests and the built web app attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build web app
        run: npm ci && npm run build
        working-directory: client
      - name: Package
        run: tar -czf ledger-dashboard-client-${GITHUB_REF_NAME}.tar.gz -C client dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ledger-dashboard-client-*.tar.gz --title "$GITHUB_REF_NAME" --generate-notes
