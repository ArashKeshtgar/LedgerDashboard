<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Job Application Ledger">
  <title>Job Application Ledger</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3eefc"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#2a78d6" stroke-opacity=".25" stroke-width="1.5"/>

  <!-- a stack of books: the work put in -->
  <rect x="6" y="48.5" width="32" height="8.5" rx="1.8" fill="#1f5fad"/>
  <rect x="30.5" y="49.8" width="7.5" height="5.9" rx="1" fill="#ffffff"/>
  <path d="M31.5 51.9h6.5M31.5 53.6h6.5" stroke="#bcd5f5" stroke-width=".7"/>
  <path d="M10 48.5v8.5M12.5 48.5v8.5" stroke="#ffffff" stroke-opacity=".55" stroke-width="1"/>
  <rect x="9" y="39.5" width="28" height="8.5" rx="1.8" fill="#2a78d6"/>
  <rect x="29.5" y="40.8" width="7.5" height="5.9" rx="1" fill="#ffffff"/>
  <path d="M30.5 42.9h6.5M30.5 44.6h6.5" stroke="#bcd5f5" stroke-width=".7"/>
  <path d="M13 39.5v8.5M15.5 39.5v8.5" stroke="#ffffff" stroke-opacity=".55" stroke-width="1"/>
  <rect x="7" y="30.5" width="26" height="8.5" rx="1.8" fill="#5ea3ee"/>
  <rect x="25.5" y="31.8" width="7.5" height="5.9" rx="1" fill="#ffffff"/>
  <path d="M26.5 33.9h6.5M26.5 35.6h6.5" stroke="#bcd5f5" stroke-width=".7"/>
  <path d="M11 30.5v8.5M13.5 30.5v8.5" stroke="#ffffff" stroke-opacity=".55" stroke-width="1"/>

  <!-- the path from them to the result -->
  <path d="M22 26C25 17 31 13.5 37 15" fill="none" stroke="#2a78d6" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 5.2"/>

  <!-- the result -->
  <circle cx="46" cy="18" r="10" fill="#2a78d6"/>
  <circle cx="46" cy="18" r="12.5" fill="none" stroke="#2a78d6" stroke-opacity=".25" stroke-width="2"/>
  <path d="M41.2 18.2l3.4 3.4 6.4-7" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
