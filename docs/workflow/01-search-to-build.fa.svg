<svg width="100%" viewBox="0 0 680 585" xmlns="http://www.w3.org/2000/svg" role="img" direction="rtl">
<title>چرخه‌ی جست‌وجو تا ساخت پکیج، با ورودی‌های آگهی و بانک حقیقت</title>
<desc>جستجوی دستی پیدا کردن یک آگهی شغلی را نتیجه می‌دهد؛ Analyze آن آگهی را در کنار بانک حقیقت می‌خواند و امتیاز و شکاف تولید می‌کند؛ سپس تصمیم انسانی برای رد یا تایید، تا ساخت رزومه و کاورلتر</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<style>
text{font-family:Tahoma,'Segoe UI',sans-serif;fill:#3d3d3a}
.th{font-size:14px;font-weight:600}
.ts{font-size:12px;fill:#73726c}
.box{fill:#f1efe8;stroke:#888780;stroke-width:0.5}
.c-blue{fill:#e6f1fb;stroke:#378add;stroke-width:0.5}
.c-blue text.th{fill:#0c447c}
.c-teal{fill:#e1f5ee;stroke:#1d9e75;stroke-width:0.5}
.c-teal text.th{fill:#085041}
.arr{stroke:#73726c;stroke-width:1.5}
</style>

<rect class="box" x="190" y="20" width="300" height="56" rx="8"/>
<text class="th" x="340" y="38" text-anchor="middle" dominant-baseline="central">جستجوی دستی در چت</text>
<text class="ts" x="340" y="56" text-anchor="middle" dominant-baseline="central">LinkedIn، ZipRecruiter</text>

<line x1="340" y1="76" x2="340" y2="136" class="arr" marker-end="url(#arrow)"/>

<rect class="box" x="250" y="136" width="180" height="44" rx="8"/>
<text class="th" x="340" y="158" text-anchor="middle" dominant-baseline="central">آگهی شغلی</text>

<line x1="340" y1="180" x2="340" y2="240" class="arr" marker-end="url(#arrow)"/>

<rect class="box" x="40" y="246" width="135" height="44" rx="8"/>
<text class="th" x="108" y="268" text-anchor="middle" dominant-baseline="central">بانک حقیقت</text>

<line x1="175" y1="268" x2="188" y2="268" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue">
<rect x="190" y="240" width="300" height="56" rx="8"/>
<text class="th" x="340" y="258" text-anchor="middle" dominant-baseline="central">Analyze</text>
<text class="ts" x="340" y="276" text-anchor="middle" dominant-baseline="central">امتیاز تطبیق + شکاف‌ها</text>
</g>

<line x1="340" y1="296" x2="230" y2="356" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="296" x2="450" y2="356" class="arr" marker-end="url(#arrow)"/>

<rect class="box" x="130" y="356" width="200" height="56" rx="8"/>
<text class="th" x="230" y="374" text-anchor="middle" dominant-baseline="central">Skip</text>
<text class="ts" x="230" y="392" text-anchor="middle" dominant-baseline="central">درفت حذف می‌شه</text>

<g class="c-teal">
<rect x="350" y="356" width="200" height="56" rx="8"/>
<text class="th" x="450" y="374" text-anchor="middle" dominant-baseline="central">Apply</text>
<text class="ts" x="450" y="392" text-anchor="middle" dominant-baseline="central">تایید انسانی</text>
</g>

<line x1="450" y1="412" x2="340" y2="472" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
<rect x="190" y="472" width="300" height="56" rx="8"/>
<text class="th" x="340" y="490" text-anchor="middle" dominant-baseline="central">Build</text>
<text class="ts" x="340" y="508" text-anchor="middle" dominant-baseline="central">رزومه، کاورلتر، گزارش</text>
</g>

<text class="ts" x="340" y="562" text-anchor="middle">&#8594; ادامه در نمودار بعدی (Pipeline)</text>
</svg>
