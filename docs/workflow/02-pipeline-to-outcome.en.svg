<svg width="100%" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Pipeline-to-outcome cycle, with the return loop from gap to project</title>
<desc>From entering Applied, through pipeline progress, to three possible outcomes — Offer, still in progress, or Rejected — after which gap stats suggest a new portfolio project that strengthens the fact bank and restarts the cycle with a stronger resume</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<style>
text{font-family:-apple-system,'Segoe UI',sans-serif;fill:#3d3d3a}
.th{font-size:14px;font-weight:600}
.ts{font-size:12px;fill:#73726c}
.box{fill:#f1efe8;stroke:#888780;stroke-width:0.5}
.c-green{fill:#eaf3de;stroke:#639922;stroke-width:0.5}
.c-green text.th{fill:#27500a}
.c-red{fill:#fcebeb;stroke:#e24b4a;stroke-width:0.5}
.c-red text.th{fill:#791f1f}
.c-gray{fill:#f1efe8;stroke:#888780;stroke-width:0.5}
.arr{stroke:#73726c;stroke-width:1.5}
</style>

<rect class="box" x="190" y="20" width="300" height="56" rx="8"/>
<text class="th" x="340" y="38" text-anchor="middle" dominant-baseline="central">Applied</text>
<text class="ts" x="340" y="56" text-anchor="middle" dominant-baseline="central">After approval</text>

<line x1="340" y1="76" x2="340" y2="136" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
<rect x="190" y="136" width="300" height="56" rx="8"/>
<text class="th" x="340" y="154" text-anchor="middle" dominant-baseline="central">Pipeline progress</text>
<text class="ts" x="340" y="172" text-anchor="middle" dominant-baseline="central">Interview, final round</text>
</g>

<line x1="340" y1="192" x2="136" y2="252" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="192" x2="340" y2="252" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="192" x2="546" y2="252" class="arr" marker-end="url(#arrow)"/>

<g class="c-green">
<rect x="43" y="252" width="185" height="56" rx="8"/>
<text class="th" x="135" y="270" text-anchor="middle" dominant-baseline="central">Offer</text>
<text class="ts" x="135" y="288" text-anchor="middle" dominant-baseline="central">Contract signed</text>
</g>

<rect class="box" x="248" y="252" width="185" height="56" rx="8"/>
<text class="th" x="340" y="270" text-anchor="middle" dominant-baseline="central">Still in progress</text>
<text class="ts" x="340" y="288" text-anchor="middle" dominant-baseline="central">Waiting to hear back</text>

<g class="c-red">
<rect x="453" y="252" width="185" height="56" rx="8"/>
<text class="th" x="546" y="270" text-anchor="middle" dominant-baseline="central">Rejected</text>
<text class="ts" x="546" y="288" text-anchor="middle" dominant-baseline="central">Application declined</text>
</g>

<line x1="546" y1="312" x2="340" y2="368" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
<rect x="190" y="368" width="300" height="56" rx="8"/>
<text class="th" x="340" y="386" text-anchor="middle" dominant-baseline="central">Stats</text>
<text class="ts" x="340" y="404" text-anchor="middle" dominant-baseline="central">Which gap costs the most</text>
</g>

<line x1="340" y1="424" x2="340" y2="484" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
<rect x="190" y="484" width="300" height="56" rx="8"/>
<text class="th" x="340" y="502" text-anchor="middle" dominant-baseline="central">New portfolio project</text>
<text class="ts" x="340" y="520" text-anchor="middle" dominant-baseline="central">Strengthens the fact bank</text>
</g>

<text class="ts" x="340" y="574" text-anchor="middle">&#8635; back to Apply &#8212; with an updated resume from diagram one</text>
</svg>
