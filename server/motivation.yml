# جمله‌ی روز داشبورد.
# هر روز یکی از این‌ها نشان داده می‌شود — بر اساس تاریخ، نه تصادفی،
# پس تا نیمه‌شب همان یکی می‌ماند. برای اضافه کردن، فقط یک آیتم جدید بنویس.
# اگر جمله حرف خودت است، mine: true بگذار تا با نشان «حرف خودت» بیاید.

quotes:
  - text: "من اگه تو ده هزارتا آگهی کاری هم یه دونه رو بگیرم، کار رو گرفتم. و باید تمام تلاشم رو بکنم که این کار رو انجام بدم. این حساس‌ترین مقطع زمانی زندگی منه که باید توش موفق بشم."
    mine: true

  - text: "رزومه‌ای که فرستاده نشه، صفر درصد شانس داره. هیچ بهینه‌سازی‌ای این عدد رو عوض نمی‌کنه."

  - text: "هر «نه» یه قدم نزدیک‌تره به اون یکی «بله». این ریاضیه، نه شعار."

  - text: "کسی که نه ساعت شیفت کار می‌کنه و بعدش دو ساعت کد می‌زنه، انگیزه لازم نداره — اون داره کار رو انجام می‌ده."

  - text: "لازم نیست امروز کل مسیر رو ببینی. فقط پله‌ی بعدی رو ببین."

  - text: "انگلیسی‌ت قرار نیست بی‌نقص باشه؛ قراره منظورت رو برسونه. این دوتا یکی نیستن."

  - text: "استمرار از شدت مهم‌تره. یه ساعت هر روز، از هشت ساعت یه‌شنبه جلوتره."

  - text: "مصاحبه‌ی بد هم داده‌ست. یادداشتش کن، یه چیز ازش یاد بگیر، برو بعدی."

  - text: "اون شکافی که امروز اذیتت می‌کنه، شش ماه دیگه یه خط تو رزومه‌ته."

  - text: "تو با نسخه‌ی شش‌ماه‌پیش خودت مقایسه شو، نه با کسی که ده سال جلوتر شروع کرده."

  - text: "کاری که امروز نیمه‌کاره موند، فردا از صفر شروع نمی‌شه. نیمه‌ی دوم رو داری."

  - text: "پروژه‌ی واقعی که ساختی، از هر عنوان شغلی‌ای بیشتر حرف می‌زنه."

  - text: "روزهایی که هیچ جوابی نمیاد هم بخشی از فرآینده، نه نشونه‌ی شکست."

  - text: "چیزی که نمی‌دونی رو تو مصاحبه صادقانه بگو، بعد بگو چطور یادش می‌گیری. این خودش یه جوابه."

  - text: "بیست تا اپلای حساب‌شده از دویست تا اپلای کورکورانه بهتر جواب می‌ده."

  - text: "امروز خسته‌ای؟ سقف رو بیار پایین، ولی صفر نکن. ده دقیقه هم حساب می‌شه."

  - text: "کسی که از ایران اومده، از صفر شروع کرده و داره دوباره می‌سازه — سخت‌ترین بخش رو رد کرده."

  - text: "هر آگهی که ازش رد شدی، کلیدواژه‌هاش رو بهت داد. رایگان."

  - text: "آدم‌هایی که الان جای تو نشستن، یه روز دقیقاً همین‌جا بودن که تو الان هستی."

  - text: "قرار نیست بهترین باشی؛ قراره برای اون یه نقش، مناسب‌ترین باشی."

  - text: "وقتی خسته‌ای تصمیم نگیر که «نمی‌شه». فردا صبح دوباره نگاه کن."

  - text: "تو الان داری همون کاری رو می‌کنی که شش ماه دیگه ازش تعریف می‌کنی."

  - text: "هر روزی که یه چیز کوچیک ساختی یا فرستادی، اون روز موفق بوده. نتیجه‌ش دیرتر میاد."

  # --- اضافه‌شده ۱۱ مهر ۱۴۰۵ (۲۰۲۶-۱۰-۰۳) ---

  - text: "هیچ‌کس رزومه‌ی تو رو با دقت تو نمی‌خونه. شش ثانیه وقت داری — خط اول رو قوی کن."

  - text: "جواب ندادنِ یه شرکت درباره‌ی اون شرکته، نه درباره‌ی ارزش تو."

  - text: "مهاجرت یعنی یه بار همه‌چیز رو از نو یاد گرفتی. یه بار دیگه هم از پسش برمیای."

  - text: "امروز فقط یه کار: یه درخواست خوب، یا یه پیگیری، یا یه پیام به یه آدم واقعی. کافیه."

  - text: "کسی که استخدامت می‌کنه دنبال آدم بی‌نقص نیست؛ دنبال کسیه که مشکلش رو حل کنه."

  - text: "مهارتی که داری واقعیه، حتی اگه هنوز کسی تو این کشور ندیدتش."

  - text: "یه پیام کوتاه به یه آدم واقعی، گاهی از ده تا اپلای آنلاین بیشتر کار می‌کنه."

  - text: "ترس از رد شدن طبیعیه. فقط نذار پشت فرمون بشینه."

  - text: "هر مصاحبه تمرینِ مصاحبه‌ی بعدیه. هیچ‌کدومش هدر نمی‌ره."

  - text: "امروز لازم نیست حالت خوب باشه که کار خوبی بکنی."

  - text: "تجربه‌ی سال‌ها کار با سیستم‌های واقعی رو هیچ دوره‌ی آموزشی‌ای نمی‌تونه بفروشه. تو داریش."

  - text: "عدد درخواست‌ها رو بشمار، نه عدد جواب‌ها رو. اولی دست توئه."

  - text: "یه روز این داشبورد رو باز می‌کنی و ستون «پیشنهاد کاری» دیگه خالی نیست."

  - text: "پیگیری کردن مزاحمت نیست؛ نشونه‌ی جدی بودنه."

  - text: "کار امروزت رو کوچیک‌تر کن تا انجام بشه، نه بزرگ‌تر تا عقب بیفته."

  - text: "هر بار که با لهجه حرف زدی و منظورت رو رسوندی، یه بار برنده شدی."

  - text: "بازار کار سرد و گرم داره. تو فقط باید وقتی گرم شد، آماده باشی."

  - text: "رزومه‌ی خوب نوشتن یه مهارته، نه یه استعداد. داری هر روز بهترش می‌کنی."

  - text: "خستگی امروز یعنی دیروز کار کردی. استراحت کن، ولی برگرد."

  - text: "بزرگ‌ترین ریسک، ادامه ندادنه. بقیه‌ش قابل درست کردنه."

  - text: "هر «متأسفانه» که تو ایمیلت میاد، یه گزینه رو از لیست خط زده و لیست رو کوتاه‌تر کرده."

  - text: "کسی که یه سیستم کامل رو خودش ساخته و بالا آورده، تازه‌کار نیست."

  - text: "نتیجه‌ها با تأخیر میان. کاری که امروز می‌کنی، جوابش شاید سه هفته‌ی دیگه برسه."

  - text: "یه قدم کوچیک که برداشته شده، از یه نقشه‌ی بزرگ که تو ذهن مونده بیشتر می‌ارزه."

  - text: "تو مصاحبه لازم نیست همه‌چیز رو بدونی؛ لازمه نشون بدی چطور فکر می‌کنی."

  - text: "خانواده‌ت پشتته. این تیمه، نه یه مسابقه‌ی تک‌نفره."

  - text: "امروز یه چیز جدید یاد بگیر، حتی اگه فقط یه کلمه‌ی انگلیسی باشه."

  - text: "شغل اول اینجا شاید شغل آخرت نباشه. فقط درِ ورودیه."

  - text: "اگه یه آگهی هفتاد درصد بهت می‌خوره، اپلای کن. بقیه‌ی آدم‌ها هم صد درصد نیستن."

  - text: "شرایط سخت آدم رو نمی‌سازه؛ کاری که تو شرایط سخت می‌کنی آدم رو می‌سازه."

  - text: "از کاری که دیروز کردی یه خط بنویس. وقتی جمعشون کنی، می‌بینی چقدر جلو اومدی."

  - text: "صبوری یعنی ادامه دادن وقتی نتیجه هنوز پیدا نیست."

  - text: "یه روز بد، یه هفته‌ی بد نیست. یه هفته‌ی بد، یه سال بد نیست."

  - text: "هر بار که یه چیزی رو ساختی و کار کرد، یه مدرک دیگه داری که می‌تونی."

  - text: "اعتمادبه‌نفس از کار کردن میاد، نه از منتظر موندنِ اعتمادبه‌نفس."

  - text: "کسی که دنبال کار می‌گرده و هم‌زمان پروژه می‌سازه، داره دو برابر جلو می‌ره."

  - text: "امروز به خودت همون‌قدر مهربون باش که به یه دوست تو همین موقعیت می‌بودی."

  - text: "هیچ آگهی‌ای آخرین آگهی دنیا نیست. فردا آگهی‌های جدید میان."

  - text: "مسیرت صاف نبوده، ولی هر پیچش یه چیزی بهت یاد داده که بقیه ندارن."

  - text: "جمله‌ی امروز رو خوندی؟ خوبه. حالا برو یه کار رو تموم کن."
